# Shadowrocket 完整配置

[General]
ipv6=true
bypass-system=true
skip-proxy=192.168.0.0/16,10.0.0.0/8,127.0.0.0/8,localhost,*.local
dns-server=1.1.1.1,8.8.8.8

[Proxy]
PROXY = direct
中转 = direct

[Proxy Group]
Proxy = select,PROXY,中转

[Rule]

# ==============================
# TikTok 精准分流规则
# ==============================

# 验证码 / 安全验证 / 图片接口 → 走代理
DOMAIN-KEYWORD,verify,Proxy
DOMAIN-KEYWORD,cdn-tos,Proxy
DOMAIN-KEYWORD,security,Proxy
DOMAIN-KEYWORD,captcha,Proxy
DOMAIN-KEYWORD,verification,Proxy

# 主接口（动态 / API）→ 中转
DOMAIN-KEYWORD,tiktokv,中转

# 苹果相关直连
DOMAIN-SUFFIX,apple.com,DIRECT
DOMAIN-SUFFIX,icloud.com,DIRECT

# 本地网段直连
IP-CIDR,192.168.0.0/16,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT
IP-CIDR,172.16.0.0/12,DIRECT
IP-CIDR,127.0.0.0/8,DIRECT

# 中国大陆 IP 直连
GEOIP,CN,DIRECT

# 全局兜底规则
FINAL,Proxy

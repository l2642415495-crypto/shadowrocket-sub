# Shadowrocket Complete Config

[General]
ipv6=true
bypass-system=true
skip-proxy=192.168.0.0/16,10.0.0.0/8,127.0.0.1,localhost,*.local
dns-server=1.1.1.1,8.8.8.8
fallback-dns-server=8.8.4.4,1.0.0.1

[Proxy]
HK = ss,1.1.1.1,8388,aes-256-gcm,"password"

[Proxy Group]
Proxy = select,HK,DIRECT

[Rule]

# TikTok
DOMAIN-KEYWORD,tiktok,Proxy
DOMAIN-KEYWORD,tiktokv,Proxy
DOMAIN-KEYWORD,tiktokcdn,Proxy
DOMAIN-SUFFIX,tiktok.com,Proxy
DOMAIN-SUFFIX,tiktokv.com,Proxy
DOMAIN-SUFFIX,tiktokcdn.com,Proxy

# Apple
DOMAIN-SUFFIX,apple.com,DIRECT
DOMAIN-SUFFIX,icloud.com,DIRECT

# Local Network
IP-CIDR,127.0.0.0/8,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT
IP-CIDR,172.16.0.0/12,DIRECT
IP-CIDR,192.168.0.0/16,DIRECT

# China Direct
GEOIP,CN,DIRECT

# Final
FINAL,Proxy
